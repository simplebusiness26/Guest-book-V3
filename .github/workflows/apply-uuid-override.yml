name: Apply tested uuid override

on:
  push:
    branches: [feature/events-mvp]

permissions:
  contents: write

jobs:
  apply-tested-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/events-mvp
          fetch-depth: 0

      - name: Check whether patch is needed
        id: patch
        shell: bash
        run: |
          if grep -q '"uuid": "\^11.1.1"' package.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.patch.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate patched dependency files
        if: steps.patch.outputs.needed == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          pkg.overrides={...(pkg.overrides || {}),uuid:"^11.1.1"};
          fs.writeFileSync("package.json",JSON.stringify(pkg,null,2)+"\n");
          NODE
          npm install --package-lock-only

      - name: Install and audit patched tree
        if: steps.patch.outputs.needed == 'true'
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Run release checks
        if: steps.patch.outputs.needed == 'true'
        env:
          CI: true
        run: |
          npm run verify:social
          npx expo-doctor
          npx expo export --platform web --output-dir dist-uuid-patch

      - name: Commit tested dependency patch
        if: steps.patch.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch transitive uuid dependency"
          git push origin HEAD:feature/events-mvp
