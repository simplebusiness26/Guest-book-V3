name: Guestbook Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guestbook-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Expo web build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Explorer social layer
        run: npm run verify:social

      - name: Check Expo project
        run: npx expo-doctor

      - name: Build Expo web app
        env:
          CI: true
        run: npx expo export --platform web --output-dir dist-ci

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: guestbook-web-preview
          path: dist-ci
          retention-days: 7
