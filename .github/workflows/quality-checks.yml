name: Guestbook Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guestbook-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Expo web build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit details
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs=require("fs");
          const audit=JSON.parse(fs.readFileSync("npm-audit.json","utf8"));
          console.log("AUDIT TOTALS",JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for(const [name,item] of Object.entries(audit.vulnerabilities || {})){
            console.log(`AUDIT PACKAGE ${name} severity=${item.severity} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)}`);
            for(const via of item.via || []){
              if(typeof via==="object") console.log(`AUDIT ADVISORY source=${via.source} title=${via.title} range=${via.range} url=${via.url}`);
            }
            console.log(`AUDIT EFFECTS ${(item.effects || []).join(",") || "none"}`);
            console.log(`AUDIT NODES ${(item.nodes || []).join(",") || "none"}`);
          }
          NODE

      - name: Test non-breaking dependency fixes
        shell: bash
        run: |
          cp package-lock.json package-lock.original.json
          npm audit fix --package-lock-only || true
          cp package-lock.json package-lock.safe-fix.json
          npm audit --json > npm-audit-after-safe-fix.json || true
          node <<'NODE'
          const fs=require("fs");
          const audit=JSON.parse(fs.readFileSync("npm-audit-after-safe-fix.json","utf8"));
          console.log("SAFE FIX AUDIT TOTALS",JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
          mv package-lock.original.json package-lock.json

      - name: Block high severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify Explorer social layer
        run: npm run verify:social

      - name: Check Expo project
        run: npx expo-doctor

      - name: Build Expo web app
        env:
          CI: true
        run: npx expo export --platform web --output-dir dist-ci

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: guestbook-web-preview
          path: dist-ci
          retention-days: 7

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-after-safe-fix.json
            package-lock.safe-fix.json
          retention-days: 7

  uuid-override-test:
    name: Patched uuid override test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate patched dependency files
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          pkg.overrides={...(pkg.overrides || {}),uuid:"^11.1.1"};
          fs.writeFileSync("package.json",JSON.stringify(pkg,null,2)+"\n");
          NODE
          npm install --package-lock-only
          cp package.json package.uuid-override.json
          cp package-lock.json package-lock.uuid-override.json

      - name: Install patched dependency tree
        run: npm ci

      - name: Require a clean dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit-uuid-override.json || true
          node <<'NODE'
          const fs=require("fs");
          const audit=JSON.parse(fs.readFileSync("npm-audit-uuid-override.json","utf8"));
          const totals=audit.metadata?.vulnerabilities || {};
          console.log("UUID OVERRIDE AUDIT TOTALS",JSON.stringify(totals));
          if(Number(totals.total || 0)!==0) process.exit(1);
          NODE

      - name: Verify Explorer social layer
        run: npm run verify:social

      - name: Check Expo project
        run: npx expo-doctor

      - name: Build Expo web app
        env:
          CI: true
        run: npx expo export --platform web --output-dir dist-uuid-override

      - name: Upload patched dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: uuid-override-candidate
          path: |
            package.uuid-override.json
            package-lock.uuid-override.json
            npm-audit-uuid-override.json
          retention-days: 7
